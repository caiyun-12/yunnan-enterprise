name: Update Data

on:
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨2点执行
  workflow_dispatch:  # 支持手动触发

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          cd frontend && npm install

      - name: Run spider
        run: |
          python spider/run_spider.py

      - name: Build frontend
        run: |
          cd frontend && npm run build

      - name: Generate sitemap
        run: |
          node generate_sitemap.js

      - name: Commit changes
        run: |
          git config --local user.email "github[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Bot"
          git add frontend/public/data/
          git add frontend/public/sitemap.xml
          git add frontend/dist/
          git diff --staged --quiet || git commit -m "Update data and sitemap $(date +'%Y-%m-%d %H:%M')"
          git push